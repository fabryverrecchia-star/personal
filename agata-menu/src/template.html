<title>Agata Smart Menu</title>
<meta name="theme-color" content="#FBD09C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-base" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Nanum+Myeongjo:wght@400;700&display=swap">
<style id="agata-css">
/* Carte de table au téléphone : une colonne étroite, des photos en premier, des rubriques qui se plient. */
:root{
  --peach:#FBD09C;   /* couverture du menu papier */
  --paper:#FFF8F0;   /* fond des pages */
  --blush:#FDE9D6;   /* page cocktails */
  --red:#D62C38;     /* wordmark, noms des plats */
  --coral:#EE3E3F;   /* bloc cocktails */
  --mustard:#D9AC39; /* pommettes, accents */
  --ink:#231F20;     /* trait du visage, texte */
  --ink-2:#6E5F58;   /* texte secondaire */
  --navy:#1F4C97;    /* titres de la carte des boissons */
  --leaf:#2F8A4A;    /* végétarien */
  --line:rgba(35,31,32,.12);
  --display:"Bodoni Moda","Cormorant Garamond","Amiri",Didot,"Bodoni 72",serif;
  --name:"Nanum Myeongjo","Cormorant Garamond","Amiri",Georgia,serif;
  --body:"Helvetica Neue",Helvetica,Arial,"Noto Sans Arabic",sans-serif;
  --type:"Courier Prime","Courier New","Amiri",monospace;
  --r:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
img{display:block;max-width:100%}
svg{display:block}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- Preloader ---------- */
#pre{position:fixed;inset:0;z-index:100;background:var(--peach);display:grid;place-items:center;overflow:hidden;
  transition:clip-path 1s var(--ease);clip-path:inset(0 0 0 0 round 0)}
#pre.out{clip-path:inset(0 0 100% 0 round 0 0 50% 50%)}
#pre.gone{display:none}
.pre-in{width:min(92vw,560px);display:grid;justify-items:center;gap:14px;text-align:center}
.hands{width:100%;height:auto;overflow:visible}
.hands g{fill:var(--red);transition:transform .25s linear}
.hands .spark{fill:var(--mustard);opacity:0;transform-origin:209px 50px;transform-box:view-box}
#pre.touch .spark{animation:spark .7s var(--ease) forwards}
@keyframes spark{0%{opacity:1;transform:scale(.2)}60%{opacity:.9}100%{opacity:0;transform:scale(4.5)}}
.temp{font:400 46px/1 var(--name);color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.temp small{font-size:.42em;vertical-align:.95em;margin-inline-start:2px}
.phrase{font:italic 400 19px/1.3 var(--display);color:var(--ink);min-height:1.4em;transition:opacity .3s,transform .3s}
.phrase.swap{opacity:0;transform:translateY(6px)}
.pre-word{width:min(56vw,300px);fill:var(--red);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s var(--ease)}
#pre.touch .pre-word{opacity:1;transform:none}
.pre-foot{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font:11px/1 var(--body);letter-spacing:.32em;color:var(--red);text-transform:uppercase}

/* ---------- Barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:transparent;border-bottom:1px solid transparent;transition:background .3s,border-color .3s}
.top.scrolled{border-color:var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.top-row{display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px}
.top-word{width:92px;fill:var(--red);opacity:0;transform:translateY(6px);transition:opacity .35s,transform .45s var(--ease)}
.top.scrolled .top-word{opacity:1;transform:none}
.lang-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:14px;border-radius:99px;border:1px solid var(--line);
  font:700 12px/1 var(--body);letter-spacing:.14em;background:var(--paper)}
.lang-btn svg{width:14px;height:14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:0 10px;scroll-padding-inline:16px;mask-image:linear-gradient(90deg,transparent 0,#000 12px,#000 calc(100% - 24px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding-inline:13px;border-radius:99px;font:500 13px/32px var(--body);color:var(--ink-2);white-space:nowrap;transition:background .25s,color .25s}
.chip.on{background:var(--red);color:var(--paper)}
.chip.bar.on{background:var(--navy)}
.chip-sep{flex:none;width:1px;margin:7px 4px;background:var(--line)}

/* ---------- Ouverture ---------- */
.hero{position:relative;background:var(--peach);border-radius:0 0 34px 34px;overflow:hidden;padding-block:8px 34px;margin-top:-54px;padding-top:66px}
.hero .blob{position:absolute;fill:var(--mustard);opacity:.9}
.hero .b1{width:140px;top:-30px;inset-inline-end:-40px}
.hero .b2{width:220px;bottom:-120px;inset-inline-start:-70px}
.hero-in{position:relative;display:grid;justify-items:center;text-align:center;gap:10px}
.face{width:min(52vw,230px);height:auto;overflow:visible}
.face .fl{fill:var(--ink)}
.face .ck{fill:var(--mustard);transform-box:fill-box;transform-origin:center}
.face .ck1{animation:float1 7s ease-in-out infinite}
.face .ck2{animation:float2 9s ease-in-out infinite}
.face .eye-r{transform-box:fill-box;transform-origin:50% 60%}
.face.wink .eye-r{animation:wink .9s var(--ease)}
@keyframes wink{0%,100%{transform:none}35%,55%{transform:scaleY(.12) translateY(10px)}}
@keyframes float1{50%{transform:translate(4px,-6px) rotate(-4deg) scale(1.03)}}
@keyframes float2{50%{transform:translate(-5px,4px) rotate(5deg) scale(.97)}}
.hero-word{width:min(70vw,360px);fill:var(--red);margin-top:6px}
.hero-sub{font:700 11px/1 var(--body);letter-spacing:.34em;color:var(--red);text-transform:uppercase}
.hero-quote{font:italic 400 clamp(20px,5.4vw,28px)/1.2 var(--display);color:var(--coral);max-width:20ch;text-wrap:balance;margin:6px 0 4px}
.hero-go{display:flex;gap:10px;margin-top:8px}
.go{display:inline-flex;align-items:center;gap:8px;height:46px;padding-inline:20px;border-radius:99px;background:var(--red);color:var(--paper);
  font:italic 500 19px/1 var(--display);box-shadow:0 8px 22px -12px rgba(214,44,56,.8);transition:transform .3s var(--spring)}
.go.bar{background:var(--navy);box-shadow:0 8px 22px -12px rgba(31,76,151,.8)}
.go:active{transform:scale(.96)}
.hero [data-in]{opacity:0;transform:translateY(16px)}
body.ready .hero [data-in]{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--d,0) * 90ms)}

/* ---------- Rubriques ---------- */
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:22px 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font:12px/1.2 var(--body);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.fold-all{font:600 12px/1 var(--body);letter-spacing:.06em;color:var(--red);padding:10px 2px;white-space:nowrap}
.group-title{display:flex;align-items:center;gap:14px;margin:34px 0 4px;font:italic 400 15px/1 var(--display);color:var(--ink-2);letter-spacing:.02em}
.group-title::before,.group-title::after{content:"";flex:1;height:1px;background:var(--line)}
.sec{border-bottom:1px solid var(--line);scroll-margin-top:calc(106px + env(safe-area-inset-top,0px))}
.sec-head{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;padding-block:22px 18px;text-align:start}
.sec-title{font:italic 400 clamp(36px,10vw,54px)/.95 var(--display);color:var(--red);letter-spacing:-.01em;text-wrap:balance}
.sec.bar .sec-title{color:var(--navy)}
.sec-kicker{grid-column:1;font:13px/1.3 var(--body);color:var(--ink-2)}
.sec-kicker b{font-weight:400;color:var(--red);font-variant-numeric:tabular-nums}
.sec.bar .sec-kicker b{color:var(--navy)}
.plus{grid-row:1/span 2;grid-column:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .5s var(--spring),background .3s}
.plus svg{width:14px;height:14px;stroke:var(--red);stroke-width:1.6;fill:none}
.sec.bar .plus svg{stroke:var(--navy)}
.sec.open .plus{transform:rotate(45deg);background:var(--blush)}
.thumbs{grid-column:1/-1;display:flex;margin-top:6px;transition:opacity .3s,max-height .4s;max-height:40px}
.thumbs img,.thumbs i{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--paper);margin-inline-end:-9px;background:var(--peach)}
.sec.open .thumbs{opacity:0;max-height:0;margin:0}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-inner{min-height:0;overflow:hidden}
.sec-pad{padding-block:2px 30px}
.sec-note{font:italic 15px/1.35 var(--display);color:var(--ink-2);margin:18px 0 0;text-align:center}

/* Cartes */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
.grid.wide{grid-template-columns:minmax(0,1fr);gap:30px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px}.grid.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;min-width:0;display:flex;flex-direction:column;gap:9px}
.sec.open .card{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 120ms)}
@keyframes rise{from{transform:translateY(18px);opacity:.0}to{transform:none;opacity:1}}
.ph{position:relative;aspect-ratio:1;border-radius:var(--r);overflow:hidden;background:var(--peach);isolation:isolate}
.wide .ph{aspect-ratio:16/10}
.card.span2{grid-column:1/-1}
.card.span2 .ph{aspect-ratio:16/10}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 1.2s var(--ease),opacity .6s;opacity:0}
.ph img.ld{opacity:1;transform:none}
.ph-btn{position:absolute;inset:0;z-index:1}
.ph-btn:active+img,.ph:active img{transform:scale(.98)}
.ph-empty{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 70% 30%,color-mix(in srgb,var(--mustard) 55%,var(--peach)) 0 22%,transparent 23%),var(--peach)}
.ph-empty svg{width:46%;opacity:.85}
.ph-empty .fl{fill:var(--ink)}
.ph-empty .ck{fill:var(--mustard)}
.ph-empty span{position:absolute;bottom:10px;inset-inline:0;text-align:center;font:italic 12px/1 var(--display);color:var(--ink-2)}
.badges{position:absolute;top:9px;inset-inline-start:9px;z-index:2;display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:20px;padding-inline:8px;border-radius:99px;font:700 10px/1 var(--type);letter-spacing:.08em;text-transform:uppercase;background:var(--paper);color:var(--ink)}
.pill.new{background:var(--red);color:var(--paper)}
.pill.vegan{background:#C9D33E;color:var(--ink)}
.pill.bio,.pill.nature,.pill.biodyn{background:var(--navy);color:var(--paper)}
.meta h3,.meta p,.v-txt h3{margin:0}
.meta{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.name{font:400 18px/1.15 var(--name);color:var(--red);text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.wide .name,.span2 .name{font-size:23px}
.price{font:400 15px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.price em{font-style:normal;font-size:.78em;margin-inline-start:2px;color:var(--ink-2)}
.desc{grid-column:1/-1;font:12.5px/1.45 var(--body);color:var(--ink-2)}
.wide .desc,.span2 .desc{font-size:13.5px}
.ic{display:inline-block;width:13px;height:13px;vertical-align:-1px;margin-inline-start:5px}
.ic.leaf{fill:var(--leaf)}
.ic.chili{fill:var(--red)}
.hide-prices .price,.hide-desc .desc{display:none}

/* Liste (extras, carte des boissons) */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:720px){.list.cols{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:40px}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding-block:11px;border-bottom:1px dashed var(--line);align-items:baseline}
.row .name{font:400 15px/1.3 var(--name)}
.row .desc{font-size:12.5px}
.sub{grid-column:1/-1;font:italic 400 22px/1.1 var(--display);color:var(--navy);margin:22px 0 4px}
.sub:first-child{margin-top:4px}
.panel{background:var(--blush);border-radius:26px;padding:6px 18px 20px}
.panel.hot{background:var(--coral);color:var(--paper);margin-block:14px}
.panel.hot .sub{color:var(--paper)}
.panel.hot .row{border-color:rgba(255,248,240,.28)}
.panel.hot .name,.panel.hot .price,.panel.hot .desc,.panel.hot .price em{color:var(--paper)}
.drinks .name{font:400 14.5px/1.3 var(--type);color:var(--red)}
.drinks .desc{font-size:12px}

/* ---------- Pied de page ---------- */
.foot{margin-top:46px;background:var(--peach);border-radius:34px 34px 0 0;padding-block:40px calc(40px + env(safe-area-inset-bottom,0px));text-align:center}
.foot-in{display:grid;justify-items:center;gap:16px}
.seal{width:120px;fill:#EE2926;transition:transform .6s var(--spring)}
.seal-btn:active .seal{transform:rotate(-12deg) scale(.95)}
.foot-quote{font:italic 400 24px/1.2 var(--display);color:var(--coral);text-wrap:balance}
.foot p{margin:0;max-width:58ch;font:12.5px/1.5 var(--body);color:var(--ink-2)}
.wifi{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:99px;background:var(--paper);font:13px/1 var(--type)}
.wifi b{color:var(--red);font-weight:700}
.wifi button{height:30px;padding-inline:12px;border-radius:99px;background:var(--red);color:var(--paper);font:600 12px/1 var(--body)}
.addr{font:400 15px/1.3 var(--name);color:var(--red)}

/* ---------- Feuilles & visionneuse ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(35,31,32,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s var(--ease);max-width:640px;margin-inline:auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font:italic 400 28px/1.1 var(--display);color:var(--red)}
.langs{display:grid;gap:4px}
.langs button{display:flex;justify-content:space-between;align-items:center;height:52px;padding-inline:16px;border-radius:14px;font:400 18px/1 var(--name);text-align:start}
.langs button[aria-current="true"]{background:var(--blush);color:var(--red)}
.langs small{font:700 11px/1 var(--body);letter-spacing:.16em;color:var(--ink-2)}
.viewer{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:1fr auto;background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity .35s}
.viewer.on{opacity:1;pointer-events:auto}
.v-img{display:grid;place-items:center;overflow:hidden;min-height:0;touch-action:pan-y}
.v-img img{max-height:100%;width:100%;object-fit:contain;transform:scale(.94);transition:transform .6s var(--ease),opacity .3s}
.viewer.on .v-img img{transform:none}
.v-txt{padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-width:640px;width:100%;margin-inline:auto}
.v-txt .name{color:var(--peach);font-size:26px}
.v-txt .price{color:var(--paper)}
.v-txt .desc{color:rgba(255,248,240,.75);font-size:14px}
.v-nav{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.v-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,248,240,.3);display:grid;place-items:center}
.v-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.v-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:2;background:rgba(35,31,32,.5)}
.v-count{font:12px/1 var(--type);letter-spacing:.1em;opacity:.7}
[dir="rtl"] .v-nav svg,[dir="rtl"] .flip{transform:scaleX(-1)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:99px;font:13px/1.3 var(--body);transition:opacity .3s,transform .4s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Mode édition ---------- */
.adm-bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;
  padding:8px;border-radius:22px;background:var(--ink);color:var(--paper);box-shadow:0 18px 40px -18px rgba(0,0,0,.6);max-width:620px;margin-inline:auto}
.adm-bar .lbl{flex:1;min-width:0;padding-inline:8px;font:12px/1.3 var(--body)}
.adm-bar .lbl b{display:block;font:italic 400 17px/1.1 var(--display);color:var(--peach)}
.abtn{height:40px;padding-inline:14px;border-radius:14px;background:rgba(255,248,240,.12);color:var(--paper);font:600 13px/1 var(--body);white-space:nowrap}
.abtn.pri{background:var(--red)}
.abtn:disabled{opacity:.45}
body.admin{padding-bottom:90px}
.edit-dot{position:absolute;top:8px;inset-inline-end:8px;z-index:3;width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
.row .edit-dot{position:static;width:30px;height:30px;grid-row:1/span 2;grid-column:3}
.row.has-edit{grid-template-columns:minmax(0,1fr) auto auto}
.edit-dot svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:1.7}
.is-hidden{opacity:.42}
.is-hidden .name::after{content:" · masqué";font:italic 12px var(--display);color:var(--ink-2)}
.add-item{grid-column:1/-1;height:48px;border-radius:14px;border:1.5px dashed var(--red);color:var(--red);font:600 13px/1 var(--body)}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>span{font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font:16px/1.35 var(--body);color:var(--ink)}
.field textarea{min-height:92px;resize:vertical}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{height:30px;padding-inline:10px;border-radius:9px;font:700 11px/1 var(--body);letter-spacing:.1em;background:var(--blush)}
.tabs button.on{background:var(--red);color:var(--paper)}
.tabs button.miss{box-shadow:inset 0 0 0 1.5px var(--mustard)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:7px;height:36px;padding-inline:12px;border-radius:99px;background:var(--blush);font:13px/1 var(--body)}
.check input{accent-color:var(--red);width:16px;height:16px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);font:15px/1.3 var(--body)}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked{background:var(--red)}
.sw input:checked::after{transform:translateX(20px)}
.ed-img{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.ed-img .ph{aspect-ratio:1;border-radius:14px}
.ed-img .ph img{opacity:1;transform:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
