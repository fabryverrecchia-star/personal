<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mise en situation — panneau commerce</title>
<style>
  /* Façade de commerce à l’échelle : 1 mm = 0,8 px. Le panneau (800 × 750 mm) est fixé
     sur le mur enduit, à côté de la vitrine, par quatre entretoises. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #777; padding: 40px; }
  .scene { position: relative; width: 2400px; height: 1500px; overflow: hidden; background: #e7e0d4; }
  /* mur enduit à la chaux */
  .mur { position: absolute; inset: 0 0 230px 0; background: #e9e2d6 url('../livrables/print/presentoir/badigeon-chaux.png') 0 0 / 1900px auto; filter: saturate(.85) brightness(.98); }
  .mur::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, rgb(255 246 228 / .35) 0 30%, rgb(255 246 228 / 0) 55%), linear-gradient(to bottom, rgb(60 45 30 / .05), rgb(60 45 30 / .14)); }
  /* soubassement en pierre */
  .socle { position: absolute; left: 0; right: 0; bottom: 230px; height: 70px; background: linear-gradient(#b9b0a2, #a59c8d); box-shadow: inset 0 3px 0 rgb(255 255 255 / .25); }
  .socle::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 238px, rgb(70 60 50 / .35) 238px 241px); }
  /* trottoir */
  .sol { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; background: linear-gradient(#9d978e, #8a847b 40%, #7d776f); }
  .sol::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 318px, rgb(40 36 32 / .25) 318px 321px), repeating-linear-gradient(0deg, transparent 0 112px, rgb(40 36 32 / .2) 112px 114px); }
  .sol::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 26px; background: linear-gradient(rgb(30 25 20 / .35), transparent); }
  /* vitrine et porte */
  .vitrine { position: absolute; left: 1220px; top: 200px; width: 1040px; height: 1000px; background: #2f2c29; padding: 22px; box-shadow: 0 0 0 10px #cfc7b9, 0 14px 30px -10px rgb(40 30 20 / .5); display: grid; grid-template-columns: 1fr 340px; gap: 22px; }
  .vitre { background: linear-gradient(115deg, #3d4a52 0%, #52626b 22%, #2b343a 38%, #46555e 60%, #232a2f 100%); position: relative; overflow: hidden; }
  .vitre::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgb(255 255 255 / .16) 34%, transparent 40%, transparent 62%, rgb(255 255 255 / .1) 66%, transparent 72%); }
  .porte .poignee { position: absolute; left: 28px; top: 52%; width: 12px; height: 150px; border-radius: 6px; background: linear-gradient(90deg, #bdb6aa, #8d877d); }
  .porte { position: relative; }
  .enseigne { position: absolute; left: 1220px; top: 92px; width: 1040px; height: 74px; display: grid; place-items: center; font: 600 34px/1 'Hanken', Arial, sans-serif; letter-spacing: .4em; color: #4b453d; }
  /* panneau, entretoises et ombre portée */
  .pose { position: absolute; left: 200px; top: 290px; width: 640px; height: 600px; transform: perspective(2600px) rotateY(9deg); transform-origin: 100% 50%; }
  .pose img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; box-shadow: 18px 26px 34px -14px rgb(40 30 20 / .55), 4px 6px 8px rgb(40 30 20 / .25); }
  .pose i { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f4f1ea, #b8b2a6 60%, #8f897e); box-shadow: 2px 3px 4px rgb(0 0 0 / .4); }
  .lum { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(70% 60% at 25% 20%, rgb(255 244 222 / .16), transparent 70%); }
</style>
</head>
<body>
<section class="scene" data-out="mockup-panneau-facade">
  <div class="mur"></div>
  <div class="socle"></div>
  <div class="sol"></div>
  <p class="enseigne">COMMERCE</p>
  <div class="vitrine"><div class="vitre"></div><div class="vitre porte"><span class="poignee"></span></div></div>
  <!-- panneau rogné au format fini : fond perdu retiré (5 mm sur 810 × 760) -->
  <div class="pose">
    <img src="../livrables/print/panneau/panneau-fini.png" alt="">
    <i style="left:22px;top:22px"></i><i style="right:22px;top:22px"></i><i style="left:22px;bottom:22px"></i><i style="right:22px;bottom:22px"></i>
  </div>
  <div class="lum"></div>
</section>
</body>
</html>
