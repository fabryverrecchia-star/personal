<title>Agata Smart Menu</title>
<meta name="theme-color" content="#FBD09C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-base" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap">
<style id="agata-css">
/* Carte de table au téléphone : une colonne étroite, des photos en premier, des rubriques qui se plient. */
:root{
  --peach:#FBD09C;   /* couverture du menu papier */
  --paper:#FFFAF4;   /* fond des pages */
  --blush:#FDE9D6;   /* page cocktails */
  --red:#D62C38;     /* wordmark, noms des plats */
  --coral:#EE3E3F;   /* bloc cocktails */
  --mustard:#D9AC39; /* pommettes, accents */
  --ink:#231F20;     /* trait du visage, texte */
  --ink-2:#6E5F58;   /* texte secondaire */
  --navy:#1F4C97;    /* titres de la carte des boissons */
  --leaf:#2F8A4A;    /* végétarien */
  --line:rgba(35,31,32,.09);
  --display:"Nanum Myeongjo","Cormorant Garamond","Amiri",Georgia,serif;
  --name:"Nanum Myeongjo","Cormorant Garamond","Amiri",Georgia,serif;
  --body:"Helvetica Neue",Helvetica,Arial,"Noto Sans Arabic",sans-serif;
  --type:var(--body);
  --r:18px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:6px}
img{display:block;max-width:100%}
svg{display:block}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- Preloader ---------- */
#pre{position:fixed;inset:0;z-index:100;background:var(--peach);display:grid;place-items:center;overflow:hidden;
  transition:clip-path 1s var(--ease);clip-path:inset(0 0 0 0 round 0)}
#pre.out{clip-path:inset(0 0 100% 0 round 0 0 50% 50%)}
#pre.gone{display:none}
.pre-in{width:min(92vw,560px);display:grid;justify-items:center;gap:14px;text-align:center}
.hands{width:100%;height:auto;overflow:visible}
.hands g{fill:var(--red);transition:transform .25s linear}
.hands .spark{fill:var(--mustard);opacity:0;transform-origin:209px 50px;transform-box:view-box}
#pre.touch .spark{animation:spark .7s var(--ease) forwards}
@keyframes spark{0%{opacity:1;transform:scale(.2)}60%{opacity:.9}100%{opacity:0;transform:scale(4.5)}}
.temp{font:400 40px/1 var(--name);color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.temp small{font-size:.42em;vertical-align:.95em;margin-inline-start:2px}
.phrase{font:400 15px/1.4 var(--display);color:var(--ink);min-height:1.4em;transition:opacity .3s,transform .3s}
.phrase.swap{opacity:0;transform:translateY(6px)}
.pre-word{width:min(56vw,300px);fill:var(--red);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .6s var(--ease)}
#pre.touch .pre-word{opacity:1;transform:none}
.pre-foot{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font:11px/1 var(--body);letter-spacing:.32em;color:var(--red);text-transform:uppercase}

/* ---------- Barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px}
.top-word{grid-column:2;width:84px;fill:var(--red)}
.lang-btn{grid-column:3;justify-self:end;display:inline-flex;align-items:center;gap:6px;height:32px;padding-inline:4px;
  font:500 11px/1 var(--body);letter-spacing:.16em;color:var(--ink-2)}
.lang-btn svg{width:13px;height:13px}
.chips{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;height:40px;align-items:stretch;mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;font:400 11px/40px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;transition:color .3s}
.chip::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:1px;background:var(--red);transform:scaleX(0);transition:transform .45s var(--ease)}
.chip.on{color:var(--ink)}
.chip.on::after{transform:scaleX(1)}
.chip.bar::after{background:var(--navy)}
.chip-sep{flex:none;width:3px;height:3px;border-radius:50%;background:var(--line);align-self:center}

/* ---------- Ouverture ---------- */
.hero{background:var(--peach);padding-block:44px 40px}
.hero-in{display:grid;justify-items:center;text-align:center;gap:18px}
.face{width:min(34vw,150px);height:auto;overflow:visible}
.face .fl{fill:var(--ink)}
.face .ck{fill:var(--mustard);transform-box:fill-box;transform-origin:center}
.face .ck1{animation:float1 8s ease-in-out infinite}
.face .ck2{animation:float2 10s ease-in-out infinite}
.face .eye-r{transform-box:fill-box;transform-origin:50% 60%}
.face.wink .eye-r{animation:wink .9s var(--ease)}
@keyframes wink{0%,100%{transform:none}35%,55%{transform:scaleY(.12) translateY(10px)}}
@keyframes float1{50%{transform:translate(3px,-4px) rotate(-3deg)}}
@keyframes float2{50%{transform:translate(-3px,3px) rotate(3deg)}}
.hero-word{width:min(58vw,250px);fill:var(--red)}
.hero-sub{font:400 10px/1 var(--body);letter-spacing:.42em;color:var(--red);text-transform:uppercase;margin-inline-start:.42em}
.hero [data-in]{opacity:0;transform:translateY(12px)}
body.ready .hero [data-in]{opacity:1;transform:none;transition:opacity .9s var(--ease),transform 1.1s var(--ease);transition-delay:calc(var(--d,0) * 110ms)}

/* ---------- Rubriques ---------- */
.tools{display:flex;justify-content:flex-end;padding-block:14px 0}
.fold-all{font:400 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);padding:10px 0}
.group-title{margin:56px 0 8px;text-align:center;font:400 10px/1 var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--ink-2)}
.tools+.group-title{margin-top:14px}
.sec{border-bottom:1px solid var(--line);scroll-margin-top:calc(96px + env(safe-area-inset-top,0px))}
.sec-head{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 16px;padding-block:26px;text-align:start}
.sec-title{font:400 27px/1.1 var(--display);color:var(--red);letter-spacing:.005em}
.sec.bar .sec-title{color:var(--navy)}
.sec-kicker{grid-column:1;font:400 10px/1.4 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.plus{grid-row:1/span 2;grid-column:2;width:24px;height:24px;display:grid;place-items:center;transition:transform .55s var(--ease)}
.plus svg{width:12px;height:12px;stroke:var(--ink-2);stroke-width:1.2;fill:none}
.sec.open .plus{transform:rotate(180deg)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .65s var(--ease)}
.sec.open .sec-body{grid-template-rows:1fr}
.sec-inner{min-height:0;overflow:hidden}
.sec-pad{padding-block:0 40px}
.sec-note{font:400 12px/1.5 var(--body);color:var(--ink-2);margin:24px 0 0;text-align:center}

/* Cartes */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 14px}
.grid.wide{grid-template-columns:minmax(0,1fr);gap:40px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 22px}.grid.wide{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;min-width:0;display:flex;flex-direction:column;gap:12px}
.sec.open .card{animation:rise .8s var(--ease) both;animation-delay:calc(var(--i,0) * 40ms + 100ms)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.ph{position:relative;aspect-ratio:4/5;border-radius:3px;overflow:hidden;background:var(--peach);isolation:isolate}
.wide .ph,.card.span2 .ph{aspect-ratio:3/2}
.card.span2{grid-column:1/-1}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.03);transition:transform 1.4s var(--ease),opacity .7s;opacity:0}
.ph img.ld{opacity:1;transform:none}
.ph-btn{position:absolute;inset:0;z-index:1}
.ph-empty{position:absolute;inset:0;display:grid;place-items:center;background:var(--peach)}
.ph-empty svg{width:38%;opacity:.9}
.ph-empty .fl{fill:var(--ink)}
.ph-empty .ck{fill:var(--mustard)}
.ph-empty span{display:none}
.meta{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.meta h3,.meta p,.v-txt h3{margin:0}
.name{font:400 16px/1.25 var(--display);color:var(--ink);text-wrap:balance;min-width:0;overflow-wrap:anywhere}
.wide .name,.span2 .name{font-size:19px}
.price{font:400 13px/1 var(--body);font-variant-numeric:tabular-nums;color:var(--red);white-space:nowrap}
.price em{font-style:normal;margin-inline-start:2px}
.desc{grid-column:1/-1;font:400 12px/1.55 var(--body);color:var(--ink-2)}
.wide .desc,.span2 .desc{font-size:12.5px;max-width:52ch}
.marks{grid-column:1/-1;font:400 9.5px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--leaf)}
.marks .hot{color:var(--red)}
.hide-prices .price,.hide-desc .desc{display:none}

/* Listes (extras, carte des boissons) */
.list{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.list.cols{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding-block:13px;border-bottom:1px solid var(--line);align-items:baseline}
.list .row:last-child{border-bottom:0}
.row .name{font-size:15px}
.sub{font:400 10px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--navy);margin:30px 0 4px}
.sub:first-child{margin-top:0}

/* ---------- Pied de page ---------- */
.foot{margin-top:64px;background:var(--peach);padding-block:52px calc(48px + env(safe-area-inset-bottom,0px));text-align:center}
.foot-in{display:grid;justify-items:center;gap:18px}
.seal{width:96px;fill:var(--red);transition:transform .6s var(--spring)}
.seal-btn:active .seal{transform:rotate(-10deg)}
.foot-quote{font:400 18px/1.35 var(--display);color:var(--red)}
.foot p{margin:0;max-width:52ch;font:400 11.5px/1.6 var(--body);color:var(--ink-2)}
.wifi{display:flex;align-items:center;gap:12px;font:400 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.wifi b{color:var(--ink);font-weight:500}
.wifi button{font:500 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--red);border-bottom:1px solid currentColor;padding-bottom:2px}
.addr{font:400 14px/1.4 var(--display);color:var(--ink)}

/* ---------- Feuilles & visionneuse ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(35,31,32,.45);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:61;max-height:88vh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .5s var(--ease);max-width:640px;margin-inline:auto}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font:400 22px/1.2 var(--display);color:var(--red)}
.langs{display:grid;gap:4px}
.langs button{display:flex;justify-content:space-between;align-items:center;height:52px;padding-inline:16px;border-radius:14px;font:400 18px/1 var(--name);text-align:start}
.langs button[aria-current="true"]{background:var(--blush);color:var(--red)}
.langs small{font:700 11px/1 var(--body);letter-spacing:.16em;color:var(--ink-2)}
.viewer{position:fixed;inset:0;z-index:70;display:grid;grid-template-rows:1fr auto;background:var(--ink);color:var(--paper);opacity:0;pointer-events:none;transition:opacity .35s}
.viewer.on{opacity:1;pointer-events:auto}
.v-img{display:grid;place-items:center;overflow:hidden;min-height:0;touch-action:pan-y}
.v-img img{max-height:100%;width:100%;object-fit:contain;transform:scale(.94);transition:transform .6s var(--ease),opacity .3s}
.viewer.on .v-img img{transform:none}
.v-txt{padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-width:640px;width:100%;margin-inline:auto}
.v-txt .name{color:var(--peach);font-size:26px}
.v-txt .price{color:var(--paper)}
.v-txt .desc{color:rgba(255,248,240,.75);font-size:14px}
.v-nav{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.v-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,248,240,.3);display:grid;place-items:center}
.v-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.v-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:2;background:rgba(35,31,32,.5)}
.v-count{font:12px/1 var(--type);letter-spacing:.1em;opacity:.7}
[dir="rtl"] .v-nav svg,[dir="rtl"] .flip{transform:scaleX(-1)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:90;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);
  padding:12px 18px;border-radius:99px;font:13px/1.3 var(--body);transition:opacity .3s,transform .4s var(--ease);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Mode édition ---------- */
.adm-bar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:8px;
  padding:8px;border-radius:22px;background:var(--ink);color:var(--paper);box-shadow:0 18px 40px -18px rgba(0,0,0,.6);max-width:620px;margin-inline:auto}
.adm-bar .lbl{flex:1;min-width:0;padding-inline:8px;font:12px/1.3 var(--body)}
.adm-bar .lbl b{display:block;font:400 17px/1.1 var(--display);color:var(--peach)}
.abtn{height:40px;padding-inline:14px;border-radius:14px;background:rgba(255,248,240,.12);color:var(--paper);font:600 13px/1 var(--body);white-space:nowrap}
.abtn.pri{background:var(--red)}
.abtn:disabled{opacity:.45}
body.admin{padding-bottom:90px}
.edit-dot{position:absolute;top:8px;inset-inline-end:8px;z-index:3;width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 4px 14px -6px rgba(0,0,0,.4)}
.row .edit-dot{position:static;width:30px;height:30px;grid-row:1/span 2;grid-column:3}
.row.has-edit{grid-template-columns:minmax(0,1fr) auto auto}
.edit-dot svg{width:15px;height:15px;stroke:var(--red);fill:none;stroke-width:1.7}
.is-hidden{opacity:.42}
.is-hidden .name::after{content:" · masqué";font:12px var(--display);color:var(--ink-2)}
.add-item{grid-column:1/-1;height:48px;border-radius:14px;border:1.5px dashed var(--red);color:var(--red);font:600 13px/1 var(--body)}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>span{font:700 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font:16px/1.35 var(--body);color:var(--ink)}
.field textarea{min-height:92px;resize:vertical}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{height:30px;padding-inline:10px;border-radius:9px;font:700 11px/1 var(--body);letter-spacing:.1em;background:var(--blush)}
.tabs button.on{background:var(--red);color:var(--paper)}
.tabs button.miss{box-shadow:inset 0 0 0 1.5px var(--mustard)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:7px;height:36px;padding-inline:12px;border-radius:99px;background:var(--blush);font:13px/1 var(--body)}
.check input{accent-color:var(--red);width:16px;height:16px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);font:15px/1.3 var(--body)}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .3s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked{background:var(--red)}
.sw input:checked::after{transform:translateX(20px)}
.ed-img{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.ed-img .ph{aspect-ratio:1;border-radius:14px}
.ed-img .ph img{opacity:1;transform:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{height:42px;padding-inline:16px;border-radius:12px;background:var(--blush);font:600 13px/1 var(--body);color:var(--ink)}
.b.pri{background:var(--red);color:var(--paper)}
.b.warn{color:var(--red)}
.b:disabled{opacity:.5}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sec-adm{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--blush);margin-bottom:10px}
.sec-adm .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font:400 18px/1.2 var(--display);color:var(--red)}
.mini{display:flex;gap:6px}
.mini button{width:34px;height:34px;border-radius:10px;background:var(--paper);display:grid;place-items:center}
.mini svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.7}
.confirm{display:none;gap:8px;align-items:center;font:13px/1.3 var(--body);color:var(--red)}
.confirm.on{display:flex;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ph img{opacity:1;transform:none}
}
</style>
<div id="agata-root"></div>
<script type="application/json" id="agata-data">/*DATA*/</script>
<script id="agata-app">
/*APP*/
</script>
<script type="application/json" id="agata-images">/*IMAGES*/</script>
<script id="agata-boot">window.__agataImages&&window.__agataImages();</script>
