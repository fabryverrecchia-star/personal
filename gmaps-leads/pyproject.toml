[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaps-leads"
version = "0.1.0"
description = "Scrape Google Maps business listings, filter them into leads, export to CSV/JSON/Airtable."
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.44",
  "httpx>=0.27",
  "typer>=0.12",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leads = "gmaps_leads.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
