<title>Proposition Il Ristorante</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mise en page : la présentation de Fabrizio Verrecchia, en papier et encre, typographie Garamond.
   Toute la couleur vient du contenu d'Il Ristorante, montré dans des cadres (navigateur, téléphone, démos).
   Bandeau fixe (nom, progression, PDF), sommaire fixe à gauche, visuels épinglés qui changent au fil du texte. */
@font-face { font-family: 'EB Garamond'; src: url(__F_EBG__) format('woff2'); font-weight: 400 800; font-display: swap; }
@font-face { font-family: 'EB Garamond'; src: url(__F_EBGI__) format('woff2'); font-weight: 400 800; font-style: italic; font-display: swap; }
@font-face { font-family: 'Cormorant Garamond'; src: url(__F_CORM__) format('woff2'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'Cormorant Garamond'; src: url(__F_CORMI__) format('woff2'); font-weight: 300; font-style: italic; font-display: swap; }
@font-face { font-family: 'Garamond Swash'; src: url(__F_SWASH__) format('woff2'); font-style: italic; unicode-range: U+0026, U+0041-005A; font-display: swap; }
@font-face { font-family: 'Garamond Ornament'; src: url(__F_SWASH__) format('woff2'); unicode-range: U+0031; font-display: block; }
@font-face { font-family: 'Garamond Figures'; src: url(__F_FIG__) format('woff2'); unicode-range: U+0030-0039; font-display: swap; }
/* Polices d'Il Ristorante, utilisées seulement dans les cadres de démonstration */
@font-face { font-family: 'Salo Paolo'; src: url(__FONT_SALO__) format('woff2'); font-display: swap; }
@font-face { font-family: 'Inter'; font-weight: 300; src: url(__FONT_INTER_300__) format('woff2'); font-display: swap; }
@font-face { font-family: 'Inter'; font-weight: 400; src: url(__FONT_INTER_400__) format('woff2'); font-display: swap; }
@font-face { font-family: 'Inter'; font-weight: 500; src: url(__FONT_INTER_500__) format('woff2'); font-display: swap; }
@font-face { font-family: 'Mea Culpa'; src: url(__FONT_MEA__) format('woff2'); font-display: swap; }
:root {
  /* Présentation (marque Fabrizio Verrecchia) */
  --paper: #efede8;
  --paper-2: #e6e3dc;
  --sheet: #f8f7f3;
  --ink: #121211;
  --muted: #76726b;
  --bg: var(--paper);
  --fg: var(--ink);
  --sub: var(--muted);
  --line: color-mix(in srgb, var(--fg) 14%, transparent);
  --soft: color-mix(in srgb, var(--fg) 5%, transparent);
  --f-body: 'EB Garamond', 'Iowan Old Style', Garamond, Georgia, serif;
  --f-italic: 'Garamond Swash', 'EB Garamond', Georgia, serif;
  --f-display: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
  --f-fig: 'Garamond Figures', 'EB Garamond', Georgia, serif;
  --f-name: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  /* Il Ristorante (dans les cadres) */
  --ir-dolce: #fff5e1;
  --ir-giardino: #11573b;
  --ir-deep: #0b3b28;
  --ir-chianti: #600013;
  --ir-pomodoro: #ff3636;
  --ir-cielo: #a5d2f5;
  --ir-peonia: #fb71ad;
  --ir-ink: #23140f;
  --ir-display: 'Salo Paolo', 'Times New Roman', serif;
  --ir-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ir-script: 'Mea Culpa', 'Brush Script MT', cursive;
  --gutter: clamp(16px, 4vw, 64px);
  --bar: 60px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--bar) + 12px); }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 clamp(18px, 0.3vw + 17px, 21px)/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: clip; }
h1, h2, h3, h4, h5, h6, p, ul, ol, figure, dl, dd, blockquote { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 10px 16px; background: var(--ink); color: var(--paper); text-decoration: none; }
.skip:focus { top: 12px; }

/* Bandes */
.b-paper { --bg: var(--paper); --fg: var(--ink); --sub: var(--muted); }
.b-sheet { --bg: var(--sheet); --fg: var(--ink); --sub: var(--muted); }
.b-ink { --bg: var(--ink); --fg: var(--paper); --sub: #a8a49c; }
.b-paper, .b-sheet, .b-ink { background: var(--bg); color: var(--fg); }

/* Typographie de la présentation */
.h { font-family: var(--f-display); font-weight: 300; line-height: 0.98; letter-spacing: -0.01em; text-wrap: balance; }
.h em, .lead em, em { font-family: var(--f-italic); font-style: italic; }
.h em { font-family: 'Cormorant Garamond', var(--f-display); font-weight: 300; }
.label { font: 400 15px/1.2 var(--f-body); font-variant: small-caps; letter-spacing: 0.08em; text-transform: lowercase; color: var(--sub); }
.fig { font-family: var(--f-fig); font-style: italic; font-variant-numeric: oldstyle-nums; }
.lead { font-size: clamp(21px, 0.9vw + 16px, 27px); line-height: 1.35; max-width: 40ch; }
.prose { max-width: 62ch; display: grid; gap: 0.8em; }
.sub { color: var(--sub); }
.orn { font-family: 'Garamond Ornament', var(--f-body); font-size: 26px; line-height: 1; display: inline-block; }
.name { font-family: var(--f-name); font-weight: 500; letter-spacing: -0.01em; }

/* Bandeau fixe */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--paper); }
.bar {
  position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50; height: var(--bar);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
}
.bar-id { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; }
.bar-id .name { font-size: 15px; white-space: nowrap; }
.bar-id .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-progress { position: absolute; left: 0; bottom: -1px; height: 1px; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(var(--p, 0)); }
.btn {
  display: inline-flex; align-items: center; gap: 0.55em; padding: 0.7em 1.25em; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--fg); color: var(--bg); font: 500 14px/1 var(--f-name); text-decoration: none; white-space: nowrap;
  transition: opacity 0.3s, transform 0.4s var(--ease);
}
.btn:hover { transform: translateY(-2px); opacity: 0.88; }
.btn--ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.bar .btn { background: var(--ink); color: var(--paper); }
.btn svg { width: 15px; height: 15px; flex: none; }
@media (max-width: 560px) { .bar-id .label { display: none; } .bar .btn span { display: none; } }

/* Sommaire fixe */
.toc-wrap { position: fixed; left: 0; top: 50%; transform: translateY(-50%); z-index: 40; padding: 12px 16px 12px max(16px, env(safe-area-inset-left, 0px)); display: none; }
.toc ol { display: grid; gap: 2px; }
.toc a { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 400 15px/1 var(--f-body); color: var(--ink); opacity: 0.4; padding: 4px 0; transition: opacity 0.3s; }
.toc a i { width: 12px; height: 1px; background: currentColor; transition: width 0.4s var(--ease); }
.toc a span { opacity: 0; transform: translateX(-6px); transition: 0.3s var(--ease); white-space: nowrap; }
.toc-wrap:hover a span, .toc a.is-on span { opacity: 1; transform: none; }
.toc a.is-on { opacity: 1; }
.toc a.is-on i { width: 30px; }
.toc-wrap:hover { background: color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
@media (min-width: 1320px) { .toc-wrap { display: block; } }

/* Chapitres */
.chap { position: relative; padding-block: clamp(72px, 11vw, 160px); }
.wrap { padding-left: max(var(--gutter), env(safe-area-inset-left, 0px)); padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); max-width: 1440px; margin-inline: auto; }
@media (min-width: 1320px) { .wrap { padding-left: max(230px, var(--gutter)); } }
.head { display: grid; gap: 18px; margin-bottom: clamp(36px, 5vw, 72px); max-width: 1000px; }
.head h2 { font-size: clamp(48px, 7vw, 116px); }
.head-n { display: flex; align-items: baseline; gap: 14px; }
.head-n .fig { font-size: 30px; }
.tag { display: inline-flex; align-items: center; gap: 8px; justify-self: start; padding: 5px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); font: 400 15px/1 var(--f-body); font-variant: small-caps; letter-spacing: 0.06em; text-transform: lowercase; }
.tag--fill { background: var(--fg); color: var(--bg); box-shadow: none; }

/* Couverture */
.cover { min-height: calc(100svh - var(--bar)); margin-top: var(--bar); display: grid; align-content: center; padding-block: clamp(40px, 6vw, 90px); overflow: hidden; }
.cover-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
.cover h1 { font-size: clamp(56px, 8.6vw, 148px); margin-top: 22px; }
.cover .lead { margin-top: 26px; }
.cover-meta { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 8px 36px; margin-top: 40px; font-size: 17px; }
.cover-meta .label { display: block; margin-bottom: 2px; }
.cover-scroll { margin-top: 44px; display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--sub); }
.cover-scroll i { width: 1px; height: 40px; background: currentColor; animation: drip 2.2s ease-in-out infinite; transform-origin: top; }
@keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }
.mock { position: relative; aspect-ratio: 16 / 12; }
.mock .browser { position: absolute; left: 0; top: 6%; width: 88%; animation: drift 9s ease-in-out infinite; }
.mock .phone-m { position: absolute; right: 0; bottom: 0; width: 28%; animation: drift 9s ease-in-out -4.5s infinite; }
@keyframes drift { 50% { transform: translateY(-12px); } }
@media (max-width: 900px) { .cover-grid { grid-template-columns: 1fr; } .cover-meta { grid-template-columns: 1fr 1fr; } .mock { order: -1; } }

/* Cadres d'appareils (contenu Il Ristorante) */
.browser { border-radius: 12px; overflow: hidden; background: #1c1b19; box-shadow: 0 50px 90px -50px rgb(18 18 17 / 0.6), 0 0 0 1px rgb(18 18 17 / 0.12); }
.browser-bar { height: 28px; display: flex; align-items: center; gap: 6px; padding-inline: 12px; background: #2a2926; }
.browser-bar i { width: 9px; height: 9px; border-radius: 50%; background: #55534e; }
.browser-bar span { margin-left: 10px; flex: 1; height: 16px; border-radius: 6px; background: #3a3935; color: #a8a49c; font: 400 10px/16px var(--f-name); padding-inline: 8px; overflow: hidden; white-space: nowrap; }
.browser-view { position: relative; aspect-ratio: 16 / 10; background: var(--ir-deep); overflow: hidden; }
.browser-view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.phone-m { aspect-ratio: 390 / 844; border-radius: 26px; padding: 6px; background: #1c1b19; box-shadow: 0 40px 70px -35px rgb(18 18 17 / 0.65); }
.phone-m > div { position: relative; width: 100%; height: 100%; border-radius: 20px; overflow: hidden; background: var(--ir-deep); }
.phone-m img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }

/* Brief */
.brief { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.brief-table { grid-column: 1 / -1; overflow-x: auto; border-top: 1px solid var(--fg); border-bottom: 1px solid var(--fg); }
.brief-table table { width: 100%; border-collapse: collapse; min-width: 620px; }
.brief-table th, .brief-table td { text-align: left; vertical-align: top; padding: 16px 18px 16px 0; border-bottom: 1px solid var(--line); }
.brief-table th { font: 400 16px/1.3 var(--f-body); font-variant: small-caps; letter-spacing: 0.06em; text-transform: lowercase; width: 15%; color: var(--sub); }
.brief-table td:nth-child(2) { font: 300 30px/1 var(--f-display); width: 22%; }
.brief-table tr:last-child > * { border-bottom: 0; }
.focus { grid-column: span 6; padding: clamp(24px, 3vw, 40px); background: var(--ink); color: var(--paper); display: grid; gap: 14px; align-content: start; }
.focus h3 { font: 300 clamp(34px, 3.4vw, 54px)/0.98 var(--f-display); }
.focus .label { color: #a8a49c; }
.focus .btn { background: var(--paper); color: var(--ink); justify-self: start; }
.extra { grid-column: span 3; padding: 22px 0; border-top: 1px solid var(--fg); display: grid; gap: 6px; align-content: start; }
.extra h4 { font: 400 20px/1.2 var(--f-body); }
.extra p { font-size: 17px; color: var(--sub); }
@media (max-width: 980px) { .focus { grid-column: 1 / -1; } .extra { grid-column: span 6; } }
@media (max-width: 560px) { .extra { grid-column: 1 / -1; } }

/* Chiffres et constats */
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--fg); }
.figs > div { padding: 22px 18px 26px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.figs > div + div { padding-left: 18px; border-left: 1px solid var(--line); }
.figs b { font: 300 clamp(48px, 5vw, 80px)/0.9 var(--f-display); font-variant-numeric: lining-nums; }
.figs span { font-size: 17px; }
.figs small { font-size: 15px; color: var(--sub); }
@media (max-width: 860px) { .figs { grid-template-columns: 1fr 1fr; } .figs > div:nth-child(3) { border-left: 0; padding-left: 0; } }
.findings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 32px; margin-top: clamp(40px, 5vw, 72px); }
.finding { padding: 22px 0 26px; border-top: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.finding h3 { font: 300 28px/1.02 var(--f-display); }
.finding p { font-size: 17px; color: var(--sub); }
@media (max-width: 980px) { .findings { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .findings { grid-template-columns: 1fr; } }

/* Récit épinglé */
.story { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 80px); }
.story-steps { display: grid; gap: clamp(32px, 22vh, 260px); padding-block: 4vh 22vh; }
.step { display: grid; gap: 10px; max-width: 44ch; opacity: 0.3; transition: opacity 0.5s var(--ease); }
.step.is-on { opacity: 1; }
.step .fig { font-size: 30px; }
.step h3 { font: 300 clamp(32px, 2.8vw, 46px)/1 var(--f-display); }
.step p { font-size: 18px; }
.step ul { display: grid; gap: 4px; font-size: 17px; color: var(--sub); }
.step li::before { content: '— '; }
.story-media { position: sticky; top: calc(var(--bar) + 5vh); height: calc(100svh - var(--bar) - 10vh); display: grid; align-items: center; }
.stage { position: relative; }
.stage .browser { width: 92%; }
.stage .phone-m { position: absolute; right: 0; bottom: -8%; width: 25%; }
.stage .browser-view img, .stage .phone-m img { opacity: 0; transform: scale(1.03); transition: opacity 0.7s var(--ease), transform 1.2s var(--ease); }
.stage .is-on { opacity: 1 !important; transform: none !important; }
.stage:not(.has-js) .browser-view img:first-child, .stage:not(.has-js) .phone-m img:first-child { opacity: 1; transform: none; }
@media (max-width: 900px) {
  .story { grid-template-columns: 1fr; }
  .story-media { position: sticky; top: calc(var(--bar) + 8px); height: auto; z-index: 3; order: -1; padding-block: 4px 18px; background: var(--bg); }
  .story-steps { gap: 56px; padding-block: 28px 40px; }
  .step { opacity: 1; }
  .stage .phone-m { width: 24%; bottom: -6%; border-radius: 16px; padding: 4px; }
  .stage .phone-m > div { border-radius: 12px; }
}

/* Démos : le contenu est dans la DA d'Il Ristorante */
.demo { margin-top: clamp(40px, 6vw, 80px); border-radius: 14px; overflow: hidden; background: var(--ir-dolce); color: var(--ir-ink); font: 300 16px/1.5 var(--ir-sans); box-shadow: 0 50px 90px -50px rgb(18 18 17 / 0.55), 0 0 0 1px rgb(18 18 17 / 0.1); }
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; height: 34px; background: #2a2926; color: #cfcbc2; font: 400 12px/1 var(--f-name); }
.demo-bar .dots { display: flex; gap: 6px; }
.demo-bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: #55534e; }
.demo-bar .live { display: inline-flex; align-items: center; gap: 8px; }
.demo-bar .live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ir-pomodoro); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.demo .ir-d { font-family: var(--ir-display); font-weight: 400; text-transform: uppercase; line-height: 0.92; }
.demo .ir-k { font: 500 11px/1.2 var(--ir-sans); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
.demo .ir-btn { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.8em 1.3em; border: 0; border-radius: 999px; background: var(--ir-giardino); color: var(--ir-dolce); font: 500 14px/1 var(--ir-sans); cursor: pointer; justify-self: start; }
.demo .ir-btn:hover { background: var(--ir-pomodoro); }
.demo-note { margin-top: 14px; font-size: 16px; color: var(--sub); }

/* Store locator */
.locator { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); min-height: 560px; }
.loc-side { padding: 24px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.loc-field { display: grid; gap: 6px; }
.loc-field label { font: 500 11px/1 var(--ir-sans); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; }
.loc-row { display: flex; gap: 8px; }
.loc-row select { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ir-ink) 20%, transparent); background: #fff; font: 400 16px var(--ir-sans); color: var(--ir-ink); }
.loc-list { display: grid; gap: 8px; max-height: 430px; overflow-y: auto; padding-right: 4px; }
.loc-item { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid transparent; cursor: pointer; text-align: left; font: inherit; color: inherit; transition: border-color 0.3s, transform 0.4s var(--ease); }
.loc-item:hover, .loc-item.is-on { border-color: var(--ir-pomodoro); transform: translateX(3px); }
.loc-item strong { font: 400 22px/1 var(--ir-display); text-transform: uppercase; color: var(--ir-chianti); }
.loc-item .km { font: 500 13px/1 var(--ir-sans); color: var(--ir-giardino); align-self: center; font-variant-numeric: tabular-nums; }
.loc-item small { grid-column: 1 / -1; font-size: 13px; opacity: 0.75; }
.loc-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.loc-actions span { padding: 6px 10px; border-radius: 999px; font: 500 12px/1 var(--ir-sans); background: color-mix(in srgb, var(--ir-giardino) 10%, transparent); }
.loc-actions span:first-child { background: var(--ir-pomodoro); color: var(--ir-dolce); }
.loc-map { position: relative; background: var(--ir-giardino); display: grid; place-items: center; padding: 20px; min-width: 0; }
.loc-map svg { width: 100%; height: auto; max-height: 560px; }
.loc-map .land { fill: color-mix(in srgb, var(--ir-dolce) 8%, transparent); stroke: var(--ir-dolce); stroke-width: 1.2; }
.loc-map .r { fill: var(--ir-pomodoro); stroke: var(--ir-giardino); stroke-width: 2; cursor: pointer; }
.loc-map .r.is-on { r: 10; }
.loc-map .me { fill: var(--ir-cielo); stroke: var(--ir-dolce); stroke-width: 2; }
.loc-map .ring { fill: none; stroke: var(--ir-cielo); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
@keyframes ring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(4); opacity: 0; } }
.loc-map .link { stroke: var(--ir-cielo); stroke-width: 1.5; stroke-dasharray: 4 4; }
.loc-map text { fill: var(--ir-dolce); font: 500 13px var(--ir-sans); paint-order: stroke; stroke: var(--ir-giardino); stroke-width: 4px; }
@media (max-width: 860px) { .locator { grid-template-columns: 1fr; } .loc-map { order: -1; } .loc-map svg { max-height: 340px; } }

/* Back-office */
.cms { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); }
.cms-form { padding: 24px; display: grid; gap: 14px; align-content: start; background: #f3efe6; min-width: 0; }
.cms-form h4 { font: 500 13px/1.3 var(--ir-sans); letter-spacing: 0.1em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; }
